<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>요원 큐브의 iPad 학생용</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 대의 iPad 화면. 잠금 → 전화 → 홈 → 미션 앱 → 마무리 전화로 전환되는 단일 화면 앱 */
:root{
  color-scheme:dark;
  --night:#14162e; --night2:#22254a; --glass:rgba(255,255,255,.1); --line:rgba(255,255,255,.22);
  --paper:#f2f3fb; --card:#ffffff; --ink:#1b1d3a; --muted:#5b5f85; --rule:#d8daeb;
  --cuboid:#6657e8; --cuboid-soft:#e5e2ff; --cube:#e8416f; --cube-soft:#ffe0e8; --other:#5a6078; --other-soft:#e6e8f0;
  --gold:#ffc83d; --ok:#108a5b; --ok-soft:#d9f5e8; --bad:#c23b22; --bad-soft:#fde6e0;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:#fff;font-family:var(--body);font-size:18px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
#ipad{position:relative;height:100%;overflow:hidden;
  background:
   linear-gradient(30deg,rgba(255,255,255,.035) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.035) 87.5%),
   linear-gradient(150deg,rgba(255,255,255,.035) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.035) 87.5%),
   var(--night);
  background-size:80px 140px}
.status{position:absolute;inset:0 0 auto;height:34px;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status.on-paper{color:var(--ink)}
.status .right{display:flex;align-items:center;gap:10px}
.tbtn{font-size:13px;padding:2px 10px;border:1px solid currentColor;border-radius:99px;opacity:.75}
.batt{display:inline-block;width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;padding:1px}
.batt i{display:block;height:100%;background:currentColor;border-radius:1px}
.scr{position:absolute;inset:0;overflow-y:auto;padding-top:42px;padding-bottom:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:fade .3s ease}
@keyframes fade{from{opacity:.2}to{opacity:1}}
.leaving{animation:slideup .55s ease forwards}
@keyframes slideup{to{transform:translateY(-100%)}}

/* 잠금화면 */
#lock{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,4vw,56px);align-items:center;max-width:1180px;margin-inline:auto;right:0}
.lockside{min-width:0}
.owner{display:flex;align-items:center;gap:8px;font-weight:500;opacity:.85}
.date{font-size:clamp(20px,2.6vw,28px);font-weight:500;margin-top:12px}
.clock{font-family:var(--display);font-size:clamp(76px,13vw,150px);line-height:1;font-variant-numeric:tabular-nums;color:#fff}
.code-wrap{margin-top:22px}
.code-label{font-size:19px;font-weight:500}
[hidden]{display:none!important}
.code{display:flex;gap:10px;margin-top:8px}
.code span{width:24px;height:24px;border:2px solid #fff;border-radius:50%;background:transparent}
.code span.on{background:var(--gold);border-color:var(--gold);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
.quiz{background:var(--paper);color:var(--ink);border-radius:20px;padding:clamp(18px,2.6vw,30px);min-width:0}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.quiz h2{font-size:clamp(21px,2.5vw,27px);line-height:1.35;margin-top:6px;font-weight:700;text-wrap:balance}
.qopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.qopts.text{grid-template-columns:1fr}
.qopt{background:var(--card);border:2px solid var(--rule);border-radius:14px;padding:10px;min-height:58px;font-weight:500;color:var(--ink);display:grid;place-items:center;text-align:center}
.qopt svg{width:100%;max-width:150px;height:auto;display:block}
.qopt:hover{border-color:var(--cuboid)}
.qopt.right{border-color:var(--ok);background:var(--ok-soft)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{min-height:50px;margin-top:12px;font-size:17px;color:var(--muted)}
.msg.ok{color:var(--ok);font-weight:700}.msg.no{color:var(--bad);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 24px;border-radius:14px;font-weight:700;background:var(--ink);color:#fff}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;border:2px solid var(--rule);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* 전화 */
#ring,#call{display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 30%,#3a3478,var(--night) 70%)}
#ring{justify-content:center;gap:10px;text-align:center}
#ring .who{font-family:var(--display);font-size:clamp(36px,6vw,58px);line-height:1.15}
#ring .sub{opacity:.85}
.avatar{width:clamp(130px,24vh,210px);animation:ringbob 1s ease-in-out infinite}
@keyframes ringbob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.callbtns{display:flex;gap:clamp(48px,10vw,110px);margin-top:26px}
.callbtn{display:grid;justify-items:center;gap:6px;color:#fff;font-size:16px}
.callbtn i{width:76px;height:76px;border-radius:50%;display:grid;place-items:center}
.callbtn svg{width:34px;height:34px;fill:#fff}
.accept i{background:#22b463;animation:pulse 1s infinite}.decline i{background:#e23d3d}
.decline svg{transform:rotate(135deg)}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(34,180,99,.25)}}
#call{justify-content:center}
.callgrid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(18px,4vw,50px);align-items:center;max-width:1100px;width:100%}
.video{background:#0d0e20;border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;justify-items:center;position:relative}
.video svg{width:min(100%,250px);height:auto}
.live{position:absolute;left:14px;top:12px;font-size:13px;font-weight:700;color:#ff8ba5}
.callname{font-weight:700;margin-top:6px}.calltime{font-size:14px;opacity:.75;font-variant-numeric:tabular-nums}
.speech{min-width:0}
.speech p{font-size:clamp(24px,3.3vw,36px);line-height:1.45;font-weight:500;min-height:5.6em;text-wrap:pretty}
.speech p b{color:var(--gold);font-weight:700}
.speechbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.dots{display:flex;gap:6px;margin-right:auto}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}
.btn.line{background:transparent;border:2px solid var(--line);color:#fff}
.talk .mouth{animation:talk .28s infinite alternate;transform-origin:100px 146px}
@keyframes talk{to{transform:scaleY(2.4)}}

/* 홈 */
#home{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(18px,3vw,40px);align-content:center;max-width:1180px;margin-inline:auto;right:0}
.order{background:var(--paper);color:var(--ink);border-radius:22px;padding:clamp(20px,2.6vw,30px);min-width:0;position:relative;overflow:hidden}
.stamp{display:inline-block;font-family:var(--display);font-size:18px;color:var(--cube);border:3px solid var(--cube);padding:1px 12px;border-radius:6px;transform:rotate(-4deg)}
.order h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,3.8vw,44px);line-height:1.2;margin-top:14px;text-wrap:balance}
.order h1 .c1{color:var(--cuboid)}.order h1 .c2{color:var(--cube)}
.order .meta{margin-top:14px;font-size:16px;color:var(--muted)}
.progress{display:flex;gap:6px;margin-top:18px}.progress i{height:10px;flex:1;background:var(--rule);border-radius:5px}.progress i.on{background:var(--ok)}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,24px);min-width:0}
.app{display:grid;justify-items:center;gap:8px;color:#fff;font-weight:500;font-size:17px;text-align:center;position:relative}
.app .ic{width:min(100%,128px);aspect-ratio:1;border-radius:24%;display:grid;place-items:center;background:var(--c);position:relative;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.app .ic svg{width:64%;height:64%}
.app .no{position:absolute;left:7px;top:7px;min-width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:rgba(15,16,40,.72);font-family:var(--display);font-size:16px;color:#fff}
.app.locked{opacity:.42;cursor:not-allowed}
.app.next .ic{outline:4px solid var(--gold);outline-offset:3px;animation:glow 1.4s infinite}
@keyframes glow{50%{outline-color:transparent}}
.app .done{position:absolute;right:-6px;top:-6px;width:32px;height:32px;border-radius:50%;background:var(--ok);display:grid;place-items:center;font-weight:700;border:3px solid var(--night)}
.banner{position:absolute;z-index:40;top:40px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));display:flex;gap:12px;align-items:center;background:#fff;color:var(--ink);border-radius:18px;padding:10px 16px;box-shadow:0 12px 34px rgba(0,0,0,.4);animation:drop .35s}
@keyframes drop{from{transform:translate(-50%,-120%)}}
.banner svg{width:46px;flex:none}
.banner b{display:block}.banner span{font-size:15px;color:var(--muted)}

/* 미션 앱 공통 */
.mission{background:var(--paper);color:var(--ink)}
.mhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1180px;margin-inline:auto}
.back{min-height:44px;padding:0 14px 0 8px;font-weight:700;color:var(--cuboid)}
.tag{font-family:var(--display);color:var(--cube);font-size:18px}
.mhead h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3vw,36px);line-height:1.2}
.brief{display:flex;gap:12px;align-items:center;max-width:1180px;margin:10px auto 14px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 16px}
.brief svg{width:48px;flex:none}
.brief p{font-size:clamp(17px,1.9vw,20px);line-height:1.4;min-width:0}
.brief b{color:var(--gold)}
.mbody{max-width:1180px;margin-inline:auto;display:grid;gap:16px}
.two{grid-template-columns:minmax(0,6fr) minmax(0,5fr);align-items:start}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:clamp(12px,1.6vw,20px);min-width:0}
.panel h3{font-size:18px;font-weight:700}
.stage{touch-action:none;width:100%;display:block;height:290px;cursor:grab;user-select:none;-webkit-user-select:none}
.hint{font-size:15px;color:var(--muted);text-align:center}
.thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.thumb{border:2px solid var(--rule);background:var(--paper);border-radius:12px;padding:2px;display:grid;justify-items:center;font-weight:700;color:var(--ink);position:relative}
.thumb svg{width:100%;height:auto;aspect-ratio:1}
.thumb.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.thumb.t-rect{background:var(--cuboid-soft);border-color:var(--cuboid)}
.thumb.t-square{background:var(--cube-soft);border-color:var(--cube)}
.thumb.t-other{background:var(--other-soft);border-color:var(--other)}
.bins{display:grid;gap:10px;margin-top:12px}
.bin{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:66px;text-align:left;padding:10px 16px;border-radius:14px;font-weight:700;font-size:clamp(17px,1.9vw,20px);color:var(--ink);border:2px solid}
.bin small{font-weight:500;font-size:15px;white-space:nowrap}
.bin.rect{background:var(--cuboid-soft);border-color:var(--cuboid)}
.bin.square{background:var(--cube-soft);border-color:var(--cube)}
.bin.other{background:var(--other-soft);border-color:var(--other)}
.defs{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.def{border-radius:16px;padding:14px 18px}
.def.a{background:var(--cuboid-soft)}.def.b{background:var(--cube-soft)}
.def b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(25px,3vw,32px)}
.def.a b{color:var(--cuboid)}.def.b b{color:var(--cube)}
.foot{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;max-width:1180px;margin:16px auto 0}
.objs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.obj{display:grid;gap:6px;justify-items:center;padding:10px}
.obj svg{height:clamp(84px,17vh,130px);width:auto;max-width:100%}
.obj .nm{font-weight:700}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.tri button{min-height:46px;border-radius:10px;font-weight:700;font-size:15px;line-height:1.2;padding:4px 2px;background:var(--paper);border:2px solid var(--rule);color:var(--ink)}
.tri .pick-rect{background:var(--cuboid);border-color:var(--cuboid);color:#fff}
.tri .pick-square{background:var(--cube);border-color:var(--cube);color:#fff}
.tri .pick-other{background:var(--other);border-color:var(--other);color:#fff}
.tri .bad{background:var(--bad-soft);border-color:var(--bad);animation:shake .35s}
.objmsg{font-size:15px;color:var(--muted);min-height:2.9em;text-align:center}
.objmsg.no{color:var(--bad)}.objmsg.ok{color:var(--ok);font-weight:700}
.seg{display:flex;gap:6px;background:var(--paper);padding:4px;border-radius:12px}
.seg button{flex:1;min-height:44px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.term{margin-top:10px;font-size:18px;min-height:3em}
.term b{color:var(--cube)}
table{color:inherit;font:inherit;border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;margin-top:10px}
th,td{border:1px solid var(--rule);padding:8px 6px;text-align:center}
th{font-size:15px;background:var(--paper)}
td.num{font-family:var(--display);font-size:24px}
td.done{background:var(--ok-soft);color:var(--ok)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rowbtns .btn{min-height:44px;padding:6px 14px;font-size:16px}
.make{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.make div{border-radius:14px;padding:14px;background:var(--paper)}
.make svg{width:100%;max-height:150px}
.cards{display:grid;gap:10px}
.fact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:12px;align-items:center}
.fact p{font-weight:500;font-size:clamp(18px,2vw,21px)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-weight:700;font-size:16px}
.form input,.form select{min-height:50px;border:2px solid var(--rule);border-radius:12px;padding:6px 12px;background:#fff;color:var(--ink);width:100%}
.reports{display:grid;gap:8px;margin-top:10px}
.report{padding:10px 14px;border-radius:12px;font-size:18px}
.report.rect{background:var(--cuboid-soft)}.report.square{background:var(--cube-soft)}
.empty{color:var(--muted);font-size:16px;padding:12px;border:2px dashed var(--rule);border-radius:12px;margin-top:10px}
#end{background:radial-gradient(circle at 50% 20%,#3a3478,var(--night) 70%);display:flex;align-items:center;justify-content:center}
.badge{background:var(--paper);color:var(--ink);border-radius:24px;padding:clamp(20px,3vw,34px);max-width:760px;width:100%;display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:center}
.badge svg{width:100%}
.badge h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.5vw,46px);line-height:1.15}
.badge ul{margin:10px 0 0;padding-left:20px}
.badge .next{margin-top:10px;font-weight:700;color:var(--cuboid)}
.sheet{position:absolute;z-index:50;inset:0;background:rgba(5,6,20,.7);display:grid;place-items:center;padding:16px}
.sheet>div{background:var(--paper);color:var(--ink);border-radius:18px;padding:20px;width:min(520px,100%);max-height:100%;overflow:auto}
.sheet h3{font-size:20px}.sheet p{font-size:15px;color:var(--muted);margin-top:2px}
.jumps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.jumps .btn{min-height:44px;font-size:15px;padding:6px 8px}

.callgrid.withvis{grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:24px;max-width:1220px}
.withvis .video svg{width:130px}
.withvis .speech p{min-height:0;font-size:27px;line-height:1.4;margin-top:12px}
.withvis .speechbar{margin-top:10px}
.vis{background:var(--paper);color:var(--ink);border-radius:20px;padding:14px 18px;display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center}
.vis h3{grid-column:1/-1;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.2}
.vis h3 .c1,.vis .c1{color:var(--cuboid)}.vis h3 .c2,.vis .c2{color:var(--cube)}
.vis svg{width:100%;height:230px;display:block}
.vis figure{margin:0;display:grid;gap:2px;text-align:center;font-weight:700;min-width:0}
.vis .sorted{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.vis .sorted svg{height:170px}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini div{border-radius:12px;padding:6px 14px;font-size:17px}
.mini b{font-family:var(--display);font-weight:400;font-size:21px;margin-right:6px}
.mini .a{background:var(--cuboid-soft)}.mini .a b{color:var(--cuboid)}
.mini .b{background:var(--cube-soft)}.mini .b b{color:var(--cube)}
@media (min-width:1100px){
  .obj{grid-template-columns:120px minmax(0,1fr);justify-items:start;align-items:center;column-gap:12px;row-gap:4px}
  .obj svg{grid-row:1/4;height:110px;justify-self:center}
  .obj .nm,.obj .tri,.obj .objmsg{grid-column:2}
  .obj .objmsg{text-align:left;min-height:2.9em}
  .fact{padding-block:8px}
  .cards{gap:8px}
}
#keypad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
#keypad h2{font-size:26px;font-weight:700}
#keypad .sub{opacity:.85;font-size:17px}
.kdots{display:flex;gap:16px;margin:10px 0 12px}
.kdots.shake{animation:shake .35s}
.kdots i{width:18px;height:18px;border-radius:50%;border:2px solid #fff}
.kdots i.on{background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.keys button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.14);font-size:30px;font-weight:500;color:#fff}
.keys button:active{background:rgba(255,255,255,.4)}
.keys .tx{background:transparent;font-size:16px}
#wait{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:#0c7a51;color:#fff}
#wait .big{font-family:var(--display);font-size:clamp(50px,9vw,96px);line-height:1.1}
#wait .sub{font-size:22px;max-width:30em}
#codeS{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:30px;align-items:center;align-content:center;background:radial-gradient(circle at 50% 30%,#3a3478,var(--night) 70%)}
#codeS svg{width:min(100%,250px);justify-self:end}

function cmpViewer(){
  var mode='face',found={cuboid:{face:{},edge:{},vert:{}},cube:{face:{},edge:{},vert:{}}},st={},rot0={rx:.45,ry:.6};
  function lenOf(p,e){var a=p.v[e[0]],b=p.v[e[1]];return Math.round(Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])*100)}
  function lens(p){var L=[];edgesOf(p).forEach(function(e){var l=lenOf(p,e);if(L.indexOf(l)<0)L.push(l)});return L.sort(function(a,b){return b-a})}
  function drawOne(s,r){
    var sh=SHAPES[s],g=geom(sh.p,r.rx,r.ry,74,130,118),f=found[s],o='',visV={},visE={},L=lens(sh.p),len=mode==='len';
    var soft=s==='cuboid'?'#e9e6ff':'#ffe6ee';
    g.faces.filter(function(x){return x.vis}).forEach(function(x){
      x.idx.forEach(function(a,i){visV[a]=1;var b=x.idx[(i+1)%4];visE[Math.min(a,b)+'-'+Math.max(a,b)]=1});
      var on=!len&&f.face[x.i];
      o+='<polygon data-t="face" data-k="'+x.i+'" points="'+polyStr(g.pts,x.idx)+'" fill="'+(on?'#ffc83d':mix(soft,x.light))+'"/>';
    });
    edgesOf(sh.p).forEach(function(e){
      var a=g.pts[e[0]],b=g.pts[e[1]],v=visE[e[2]],xy='x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'"';
      if(len){var c=CV_LC[L.indexOf(lenOf(sh.p,e))%3];
        o+='<line '+xy+' stroke="'+c+'" stroke-width="'+(v?7:3.5)+'" stroke-linecap="round"'+(v?'':' stroke-dasharray="7 6" opacity=".85"')+' pointer-events="none"/>';return}
      if(!v)return;var on=f.edge[e[2]];
      o+='<line '+xy+' stroke="'+(on?'#e8901a':sh.c)+'" stroke-width="'+(on?8:(mode==='edge'?5:3))+'" stroke-linecap="round" pointer-events="none"/>';
      if(mode==='edge')o+='<line data-t="edge" data-k="'+e[2]+'" '+xy+' stroke="transparent" stroke-width="24"/>';
    });
    if(!len)g.pts.forEach(function(p,i){if(!visV[i])return;var on=f.vert[i];
      if(mode==='vert'||on)o+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(on?9:7)+'" fill="'+(on?'#e8901a':'#fff')+'" stroke="'+sh.c+'" stroke-width="3" pointer-events="none"/>';
      if(mode==='vert')o+='<circle data-t="vert" data-k="'+i+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="20" fill="transparent"/>'});
    var svg=$('#cv-'+s);if(svg)svg.innerHTML=o;
  }
  function drawAll(r){r=r||st.cuboid||rot0;['cuboid','cube'].forEach(function(s){drawOne(s,r)})}
  function sync(r){['cuboid','cube'].forEach(function(s){if(st[s]&&st[s]!==r){st[s].rx=r.rx;st[s].ry=r.ry}});drawAll(r)}
  function labels(){
    $$('#cvm button').forEach(function(b){b.classList.toggle('on',b.dataset.m===mode)});
    $('#cvh').textContent=CV_HINT[mode];$('#cvr').hidden=mode==='len';
    ['cuboid','cube'].forEach(function(s){var el=$('#cn-'+s);
      if(mode==='len'){el.innerHTML='모서리 색: '+lens(SHAPES[s].p).map(function(_,i){return '<i class="sw" style="background:'+CV_LC[i%3]+'"></i>'}).join('');return}
      var n=Object.keys(found[s][mode]).length,tot=TERMS[mode][2];
      el.innerHTML='센 '+TERMS[mode][0]+' <em>'+n+'</em>개'+(n===tot?'<span class="full">모두 찾았습니다!</span>':'');
    });
  }
  function setMode(m){mode=m;drawAll();labels()}
  function tap(s,t){
    var ty=t&&t.getAttribute&&t.getAttribute('data-t');if(!ty||ty!==mode)return;
    var k=t.getAttribute('data-k'),f=found[s][mode];

    drawAll();labels();
  }
  ['cuboid','cube'].forEach(function(s){st[s]=stage($('#cv-'+s),sync,{rx:rot0.rx,ry:rot0.ry,tap:function(t){tap(s,t)}})});
  $$('#cvm button').forEach(function(b){b.onclick=function(){$('#cvmsg').textContent='';setMode(b.dataset.m)}});
  $('#cvr').onclick=function(){found.cuboid[mode]={};found.cube[mode]={};drawAll();labels()};
  labels();
  return{hint:function(f){var t=CV_TIP[FACTS.indexOf(f)];if(!t)return;setMode(t[0]);var m=$('#cvmsg');m.className='msg no';m.textContent=t[1]},
    clear:function(){$('#cvmsg').textContent=''}};
}

  el.innerHTML='<div class="badge">'+agent()+'<div><span class="stamp">임무 완료</span><h1 style="margin-top:10px">직육면체·정육면체 분석 요원</h1><ul><li>직사각형 6개로 둘러싸인 도형은 직육면체</li><li>정사각형 6개로 둘러싸인 도형은 정육면체</li><li>두 도형 모두 면 6개, 모서리 12개, 꼭짓점 8개</li></ul><div class="next">지금 할 일: 태블릿 덮기 → 요원 수첩 기록 → (시간이 남으면) 수학익힘 72~73쪽</div><div class="next" style="margin-top:8px;opacity:.8">다음 지령: 직육면체의 겨냥도</div>'+(STU?'':'<div class="endcode">학생 패드 임무 완료 암호 <b>'+CODES[5]+'</b></div>')+'<div class="rowbtns">'+(STU?'<button class="btn gold" id="toRec" type="button">요원 기록 PDF로 저장</button>':'')+'<button class="btn ghost" id="toHome" type="button">홈으로 돌아가기</button></div></div></div>';
  view.appendChild(el);$('#toHome').onclick=function(){go('home')};if(STU)$('#toRec').onclick=function(){go('rec')};
}


/* ---------- 요원 기록 ---------- */
var MN=['잠금 해제 퀴즈','미션 1 큐팡: 상자 분류','미션 2 네모버: 물건의 모양','미션 3 큐글 어스: 구성 요소의 수','미션 4 도형다나와: 두 도형 비교','미션 5 요원톡: 스파이 찾기'];
function hm(t){var d=new Date(t);return d.getHours()+':'+('0'+d.getMinutes()).slice(-2)}
var MC=[['#b8a8ff','#efeaff','🔓'],['#ff8fb1','#ffe3ec','📦'],['#7fdcb5','#e2f8ee','🔍'],['#8ec5ff','#e3f1ff','🌏'],['#ffb46b','#fff0e0','⚖️'],['#ffd45c','#fff6d6','💬']];
function recBtn(name){var old=$('#recFab');if(old)old.remove();if(!STU||name!=='home')return;var b=document.createElement('button');b.className='recbtn';b.id='recFab';b.type='button';b.textContent='📄 요원 기록';b.onclick=function(){go('rec')};$('#ipad').appendChild(b)}
function summary(){
  return MN.map(function(nm,m){
    var ev=REC.ev.filter(function(e){return e.m===m&&e.it!=='미션 완료'});
    var items={};ev.forEach(function(e){(items[e.it]=items[e.it]||[]).push(e)});
    var keys=Object.keys(items),first=keys.filter(function(k){return items[k][0].ok}).length;
    var done=m===0?S.q>=Q.length:S.done[m-1];
    return {nm:nm,m:m,done:done,tries:ev.length,wrong:ev.filter(function(e){return !e.ok}).length,keys:keys,items:items,first:first};
  });
}
function cardHTML(){
  var sm=summary(),all=sm.every(function(x){return x.done}),d=new Date();
  var day='11월 11일';
  var tiles=sm.map(function(x){var c=MC[x.m],short=x.nm.split(':')[0];
    return '<div class="kc-tile" style="--t:'+c[0]+';--t-s:'+c[1]+'"><span class="ck">'+(x.done?'✓':'…')+'</span><b>'+c[2]+' '+esc(short)+'</b><div class="mt">'+(x.done?'해결했어요!':x.tries?'도전 중이에요':'아직 시작 전')+'</div><div class="big">'+(x.keys.length?x.first+' / '+x.keys.length:'-')+'</div><div class="mt">한 번에 맞힘'+(x.wrong?' · 다시 도전 '+x.wrong+'번':'')+'</div></div>'}).join('');
  var det=sm.filter(function(x){return x.keys.length}).map(function(x){var c=MC[x.m];
    return '<div class="kc-box" style="--t:'+c[0]+';--t-s:'+c[1]+'"><h4><span>'+c[2]+' '+esc(x.nm)+'</span><span>'+(x.done?'✓ 해결':'도전 중')+'</span></h4>'+x.keys.map(function(k){var L=x.items[k];
      return '<div class="kc-row"><div>'+esc(k)+'</div><div class="chips">'+L.map(function(e){return '<span class="chip '+(e.ok?'o':'x')+'">'+(e.ok?'○ ':'✗ ')+esc(e.a)+'</span>'}).join('')+'</div></div>'}).join('')+'</div>'}).join('');
  return '<div class="kc"><div class="kc-top"><span class="kc-spark" style="right:150px;top:8px">✦</span><span class="kc-spark" style="right:132px;bottom:10px;font-size:16px">✧</span>'+agent()+
    '<div><div class="ttl">요원 기록 카드</div><div class="nm">🕵️ '+(esc(REC.name)||'요원 이름')+' 요원</div><div class="dt">'+day+' · 5학년 수학 「직육면체와 정육면체를 알아볼까요」</div></div>'+
    '<div class="kc-stamp'+(all?'':' go')+'">'+(all?'임무<br>성공!':'임무<br>진행 중')+'</div></div>'+
    '<div class="kc-h">🎯 미션 결과</div><div class="kc-tiles">'+tiles+'</div>'+
    '<div class="kc-h">✏️ 내가 고른 답</div>'+(det?'<div class="kc-det">'+det+'</div>':'<div class="kc-empty">아직 기록이 없어요.</div>')+
    '<div class="kc-foot">'+(all?'⭐ 요원 큐브가 인정합니다. 당신은 직육면체·정육면체 분석 요원! ⭐':'💪 끝까지 도전해 보세요. 요원 큐브가 응원합니다!')+'</div></div>';
}
function recScr(){
  setStatus(true);
  var el=document.createElement('section');el.className='scr rec';el.id='recS';
  el.innerHTML='<div class="recwrap"><div class="rechead"><h2>📄 요원 기록</h2><div class="rowbtns" style="margin:0"><button class="btn ghost" id="rb" type="button">‹ 돌아가기</button><button class="btn gold" id="pp" type="button">PDF로 저장</button></div></div>'+
   '<div class="panel"><div class="who"><label>이름<input id="rnm" maxlength="12" autocomplete="off" placeholder="이름을 쓰세요" value="'+esc(REC.name)+'"></label></div><div class="msg" id="rmsg" aria-live="polite" style="margin-top:8px">이름을 쓰고 PDF로 저장하세요.</div></div>'+
   '<div id="prev">'+cardHTML()+'</div></div>';
  view.appendChild(el);
  function keep(){REC.name=$('#rnm').value.trim();save();var nm=$('.kc-top .nm',el);if(nm)nm.textContent='🕵️ '+(REC.name||'요원 이름')+' 요원';var m=$('#rmsg');if(m.classList.contains('no')){m.className='msg';m.textContent='이름을 쓰고 PDF로 저장하세요.'}}
  $('#rnm').addEventListener('input',keep);
  $('#rb').onclick=function(){keep();go(S.opened[5]&&S.done.every(Boolean)?'end':'home')};
  $('#pp').onclick=function(){keep();var m=$('#rmsg');
    if(!REC.name){sfxNo();m.className='msg no';m.textContent='이름을 먼저 쓰세요.';$('#rnm').focus();return}
    printRec()};
}
function printRec(){
  var doc=$('#printDoc');if(!doc){doc=document.createElement('div');doc.id='printDoc';document.body.appendChild(doc)}
  doc.innerHTML=cardHTML();
  var t=document.title;document.title='요원기록_'+REC.name;
  setTimeout(function(){window.print();setTimeout(function(){document.title=t},800)},50);
}

/* ---------- 암호 ---------- */
function codeName(i){return i<0?'작전 시작':i<5?'미션 '+(i+1):'임무 완료'}
function gateScr(){
  setStatus(false);
  var el=document.createElement('section');el.className='scr';el.id='wait';
  el.innerHTML='<div class="big">요원 접속 완료</div><div class="sub">아직 시작하지 마십시오. 선생님의 설명을 먼저 들으십시오.<br>작전 시작 암호는 선생님이 TV에서 공개합니다.</div><button class="btn gold" id="gn" type="button">작전 시작 암호 입력</button>';
  view.appendChild(el);$('#gn').onclick=function(){go('keypad',-1)};
}
function keypad(i){
  setStatus(false);var v='';
  var el=document.createElement('section');el.className='scr';el.id='keypad';
  el.innerHTML='<h2>'+codeName(i)+' 암호</h2><div class="sub" id="ks">TV에 나온 네 자리 암호를 입력하십시오.</div><div class="kdots" id="kd"></div><div class="keys">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button type="button" data-n="'+n+'">'+n+'</button>'}).join('')+'<button class="tx" type="button" id="kc">취소</button><button type="button" data-n="0">0</button><button class="tx" type="button" id="kb">지우기</button></div>';
  view.appendChild(el);
  function dots(){$('#kd').innerHTML=[0,1,2,3].map(function(k){return '<i class="'+(k<v.length?'on':'')+'"></i>'}).join('')}dots();
  function press(n){if(v.length>=4)return;v+=n;dots();if(v.length===4)setTimeout(function(){
    if(i<0&&v===START){S.started=true;sfxOk();go('lock')}
    else if(i>=0&&v===CODES[i]){S.opened[i]=true;sfxOk();if(i<5)go('m'+i);else go('end')}
    else{v='';dots();var d=$('#kd');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');$('#ks').textContent='암호가 맞지 않습니다. TV를 다시 확인하십시오.'}
  },180)}
  $$('[data-n]',el).forEach(function(b){b.onclick=function(){press(b.dataset.n)}});
  $('#kb').onclick=function(){v=v.slice(0,-1);dots()};
  $('#kc').onclick=function(){go(i<0?'gate':'home')};
}
function waitScr(i){
  setStatus(false);var last=i>=4;
  var el=document.createElement('section');el.className='scr';el.id='wait';
  el.innerHTML='<div class="big">미션 '+(i+1)+' 완료</div><div class="sub">'+(last?'요원 큐브의 마지막 전화를 TV에서 확인하십시오. 전화가 끝나면 TV에 나온 암호를 입력하십시오.':'모든 요원이 마칠 때까지 기다리십시오. 다음 암호는 TV에서 공개됩니다.')+'</div><button class="btn gold" id="wn" type="button">'+(last?'임무 완료 암호 입력':'미션 '+(i+2)+' 암호 입력')+'</button>';
  view.appendChild(el);$('#wn').onclick=function(){go('keypad',last?5:i+1)};
}
function codeScr(i){
  setStatus(false);
  var el=document.createElement('section');el.className='scr';el.id='codeS';
  el.innerHTML=agent()+'<div><h2>'+codeName(i)+' 암호</h2><div class="num">'+(i<0?START:CODES[i])+'</div><p>'+(i<0?'각자의 패드에 입력하면 잠금 화면이 열립니다. 함께 풀어 봅시다.':i<5?'각자의 패드에 입력해 미션 '+(i+1)+'을 여십시오.':'패드에 입력하면 임무 완료 화면이 열립니다.')+'</p><button class="btn gold" id="cn" type="button">'+(i<0?'잠금 화면으로':i<5?'홈으로':'임무 완료 화면 보기')+'</button></div>';
  view.appendChild(el);$('#cn').onclick=function(){go(i<0?'lock':i<5?'home':'end')};
}
var KEY='agent-cube-student-v1';
function save(){if(!STU)return;try{localStorage.setItem(KEY,JSON.stringify({s:S.started,d:S.digits,q:S.q,done:S.done,op:S.opened,b:built,c:CHAT,r:REC}))}catch(e){}}
function load(){if(!STU)return;try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o){S.started=!!o.s;S.digits=o.d;S.q=o.q;S.done=o.done;S.opened=o.op;CHAT=o.c||{};if(o.r&&o.r.ev)REC=o.r}}catch(e){}}
function confirmReset(){
  var slot=$('#sheetSlot');slot.innerHTML='<div class="sheet"><div role="dialog" aria-label="처음부터 다시"><h3>처음부터 다시 할까요?</h3><p>지금까지의 미션 기록이 지워집니다. 기록이 필요하면 먼저 <b>요원 기록</b>에서 PDF로 저장하세요.</p><div class="rowbtns"><button class="btn ghost" id="no" type="button">취소</button><button class="btn" id="yes" type="button">처음부터 다시</button></div></div></div>';
  $('#no').onclick=function(){slot.innerHTML=''};
  $('#yes').onclick=function(){slot.innerHTML='';resetAll()};
}
function resetAll(){S.started=false;S.digits=0;S.q=0;S.done=[false,false,false,false,false];S.opened=[false,false,false,false,false,false];built=true;CHAT={};REC={name:'',ev:[]};go(STU?'gate':'lock')}

/* ---------- 교사 메뉴 ---------- */
function sheet(){
  var slot=$('#sheetSlot');
  var items=[['code-1','작전 시작 암호: '+START],['lock','잠금화면'],['ring','첫 전화'],['home','홈'],['m0','미션 1 큐팡'],['ring3','정의 알려 주는 전화'],['m1','미션 2 네모버'],['m2','미션 3 큐글 어스'],['m3','미션 4 도형다나와'],['m4','미션 5 요원톡'],['ring2','마무리 전화'],['end','임무 완료 화면'],['code0','암호 미션 1: '+CODES[0]],['code1','암호 미션 2: '+CODES[1]],['code2','암호 미션 3: '+CODES[2]],['code3','암호 미션 4: '+CODES[3]],['code4','암호 미션 5: '+CODES[4]],['code5','암호 임무 완료: '+CODES[5]]];
  slot.innerHTML='<div class="sheet" id="sh0"><div role="dialog" aria-label="교사 메뉴"><h3>교사 메뉴</h3><p>원하는 장면으로 바로 이동합니다. 수업 시간 조절이나 예행연습에 사용하세요.</p><div class="jumps">'+items.map(function(a){return '<button class="btn ghost" type="button" data-g="'+a[0]+'">'+a[1]+'</button>'}).join('')+'</div>'+
   '<div class="rowbtns"><button class="btn ghost" id="vt" type="button">'+(S.voice?'소리 끄기':'소리 켜기')+'</button><button class="btn ghost" id="openAll" type="button">미션 모두 열기</button><button class="btn ghost" id="rst" type="button">처음부터 다시</button><button class="btn" id="cl" type="button">닫기</button></div></div></div>';
  function close(){slot.innerHTML=''}
  $$('[data-g]',slot).forEach(function(b){b.onclick=function(){close();var g=b.dataset.g;if(g.indexOf('code')===0)go('code',+g.slice(4));else go(g)}});
  $('#vt').onclick=function(){S.voice=!S.voice;if(!S.voice)hush();this.textContent=S.voice?'소리 끄기':'소리 켜기'};
  $('#openAll').onclick=function(){openAll=true;S.done=S.done.map(function(d,i){return i<4?true:d});close();go('home')};
  $('#rst').onclick=function(){close();resetAll()};
  $('#cl').onclick=close;
  $('#sh0').addEventListener('click',function(e){if(e.target.id==='sh0')close()});
}
var openAll=false;
if(STU)$('#tBtn').hidden=true;else $('#tBtn').onclick=sheet;
function fit(){var z=Math.max(1,Math.min(innerWidth/1280,innerHeight/720));$('#ipad').style.zoom=z}
fit();addEventListener('resize',fit);

load();go(STU&&!S.started?'gate':STU&&S.q>=Q.length?'home':'lock');tick();
})();
</script>
